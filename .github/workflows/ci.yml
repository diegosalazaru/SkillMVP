name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate data
        run: pnpm validate:data

      - name: Report data quality
        run: pnpm report:data-quality

      - name: Check pricing contract
        run: pnpm check:pricing-contract

      - name: Check publication boundary
        run: pnpm check:publication-boundary

      - name: Check selective SEO
        run: pnpm check:selective-seo

      - name: Check ingestion foundation
        run: pnpm check:ingestion-foundation

      - name: Check Analytics baseline
        run: pnpm check:analytics-baseline

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
