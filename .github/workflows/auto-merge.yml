name: Auto Merge Safe PRs

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["CI", "PR Policy"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Enable auto-merge for safe PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.draft) {
              core.info('Draft PR: skipping auto-merge.');
              return;
            }

            const labels = pr.labels.map(label => label.name);
            if (!labels.includes('safe-automerge')) {
              core.info('Missing safe-automerge label: skipping.');
              return;
            }

            if (labels.includes('needs-product-review') || labels.includes('high-risk')) {
              core.setFailed('PR has a blocking review/risk label.');
              return;
            }

            await github.graphql(`
              mutation EnablePullRequestAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number }
                }
              }
            `, { pullRequestId: pr.node_id });

            core.info(`Auto-merge enabled for PR #${pr.number}.`);
